<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1120" viewBox="0 0 1500 1120"><defs><style>@font-face{font-family:Righteous;src:url('../fonts/Righteous-Regular.ttf')}@font-face{font-family:Josefin;src:url('../fonts/JosefinSans[wght].ttf')}.t{font-family:Righteous,sans-serif;fill:#0F3A48}.b{font-family:Josefin,sans-serif;fill:#203038}</style><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E8603A"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity=".3"/></filter></defs><rect width="1500" height="1120" fill="#F7F1E4"/><text x="40" y="54" class="t" font-size="34" text-anchor="start">The leader conveyor: Dawn, Day, Dusk</text><text x="40" y="88.0" class="b" font-size="17" text-anchor="start">Each leader is paired with an event, tucked below it; only the event's lower band shows (stage, section types, twist).</text><text x="40" y="110.1" class="b" font-size="17" text-anchor="start">Every generation the leaders move one step along the sun, each event with its leader.</text><path d="M150,370 C430,120 1070,120 1350,370" fill="none" stroke="#F6C85A" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round"/><circle cx="430" cy="300" r="16" fill="#F2A86A" stroke="#0F3A48" stroke-width="3"/><text x="400" y="308" class="t" font-size="30" text-anchor="end">DAWN</text><text x="460" y="308" class="b" font-size="17" text-anchor="start" font-weight="700">the heir</text><g filter="url(#sh)"><image href="img/event_E1-3.png" x="322.9" y="433.7" width="214.2" height="299.2" /><image href="img/leader_ilka.png" x="322.9" y="330" width="214.2" height="299.2" /></g><text x="430" y="776.9" class="b" font-size="16" text-anchor="middle">Its event SEEDS: +1 Glitch in</text><text x="430" y="797.6999999999999" class="b" font-size="16" text-anchor="middle">each matching section on the</text><text x="430" y="818.5" class="b" font-size="16" text-anchor="middle">Outer Hull or next to a Fault</text><text x="430" y="839.3" class="b" font-size="16" text-anchor="middle">or Failure.</text><circle cx="750" cy="240" r="16" fill="#F6C85A" stroke="#0F3A48" stroke-width="3"/><text x="720" y="248" class="t" font-size="30" text-anchor="end">DAY</text><text x="780" y="248" class="b" font-size="17" text-anchor="start" font-weight="700">the Steward</text><g filter="url(#sh)"><image href="img/event_E2-1.png" x="642.9" y="373.7" width="214.2" height="299.2" /><image href="img/leader_pell.png" x="642.9" y="270" width="214.2" height="299.2" /></g><text x="750" y="776.9" class="b" font-size="16" text-anchor="middle">Its REIGN applies, and its</text><text x="750" y="797.6999999999999" class="b" font-size="16" text-anchor="middle">event GROWS: +1 Fault in each</text><text x="750" y="818.5" class="b" font-size="16" text-anchor="middle">matching section with threat</text><text x="750" y="839.3" class="b" font-size="16" text-anchor="middle">(a Failure if it has 2 Faults).</text><circle cx="1070" cy="300" r="16" fill="#E8603A" stroke="#0F3A48" stroke-width="3"/><text x="1040" y="308" class="t" font-size="30" text-anchor="end">DUSK</text><text x="1100" y="308" class="b" font-size="17" text-anchor="start" font-weight="700">the Elder</text><g filter="url(#sh)"><image href="img/event_E3-5.png" x="962.9" y="433.7" width="214.2" height="299.2" /><image href="img/leader_ostra.png" x="962.9" y="330" width="214.2" height="299.2" /></g><text x="1070" y="776.9" class="b" font-size="16" text-anchor="middle">Its LEGACY takes hold for the</text><text x="1070" y="797.6999999999999" class="b" font-size="16" text-anchor="middle">rest of the voyage, then its</text><text x="1070" y="818.5" class="b" font-size="16" text-anchor="middle">event COLLAPSES: matching</text><text x="1070" y="839.3" class="b" font-size="16" text-anchor="middle">sections take their threat's damage.</text><path d="M547.1,450 L632.9,390" fill="none" stroke="#E8603A" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ah)"/><path d="M867.1,390 L952.9,450" fill="none" stroke="#E8603A" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ah)"/><g filter="url(#sh)"><rect x="80" y="420" width="144" height="200" rx="10" fill="#0F3A48" stroke="#F6C85A" stroke-width="2"/><rect x="83" y="417" width="144" height="200" rx="10" fill="#0F3A48" stroke="#F6C85A" stroke-width="2"/><rect x="86" y="414" width="144" height="200" rx="10" fill="#0F3A48" stroke="#F6C85A" stroke-width="2"/><rect x="89" y="411" width="144" height="200" rx="10" fill="#0F3A48" stroke="#F6C85A" stroke-width="2"/></g><text x="152" y="654.0" class="b" font-size="15" text-anchor="middle">EVENT DECK</text><text x="152" y="673.5" class="b" font-size="15" text-anchor="middle">drawn at Dawn,</text><text x="152" y="693.0" class="b" font-size="15" text-anchor="middle">after the vote</text><path d="M238,480 Q294,460 310.9,540" fill="none" stroke="#E8603A" stroke-width="4" marker-end="url(#ah)"/><g filter="url(#sh)"><rect x="1290" y="400" width="168" height="232" rx="12" fill="#FBEFD6" stroke="#B9A57A" stroke-width="3"/><path d="M1314,456 C1314,426 1434,426 1434,456 L1434,520 L1314,520 Z" fill="#0F3A48"/><rect x="1308" y="560 " width="132" height="40" rx="8" fill="#0F3A48"/></g><text x="1374" y="666.0" class="b" font-size="15" text-anchor="middle">THE WALL</text><text x="1374" y="685.5" class="b" font-size="15" text-anchor="middle">retired leaders,</text><text x="1374" y="705.0" class="b" font-size="15" text-anchor="middle">Legacies in force</text><path d="M1187.1,450 L1280,510" fill="none" stroke="#E8603A" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ah)"/><rect x="40" y="960" width="1420" height="130" rx="16" fill="#FBEFD6" stroke="#D8CDB6"/><text x="70" y="1000" class="t" font-size="22" text-anchor="start">Time passes (end of every generation)</text><text x="70" y="1034.0" class="b" font-size="16" text-anchor="start">1. The Dusk leader and its event (and any Breakthrough) move to the next Wall slot. Day moves to Dusk, Dawn moves to Day.</text><text x="70" y="1054.8" class="b" font-size="16" text-anchor="start">2. Each generation resolves Dusk, then Day, then Dawn. At Dawn the houses vote for the heir BEFORE its event is drawn.</text></svg>