<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1180" viewBox="0 0 1500 1180"><defs><style>@font-face{font-family:Righteous;src:url('../fonts/Righteous-Regular.ttf')}@font-face{font-family:Josefin;src:url('../fonts/JosefinSans[wght].ttf')}.t{font-family:Righteous,sans-serif;fill:#0F3A48}.b{font-family:Josefin,sans-serif;fill:#203038}</style><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E8603A"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity=".3"/></filter></defs><rect width="1500" height="1180" fill="#F7F1E4"/><text x="40" y="54" class="t" font-size="34" text-anchor="start">The Wall of Leaders: how a leader retires</text><text x="40" y="86.0" class="b" font-size="17" text-anchor="start">At Time passes, the Dusk leader slides into the next empty slot, from the top edge, between the two layers of the Wall.</text><text x="40" y="108.1" class="b" font-size="17" text-anchor="start">Its portrait shows in the frame and its Legacy in the plaque below, still in force for the rest of the voyage.</text><text x="220.5" y="150" class="t" font-size="22" text-anchor="middle">1 · Slide in from the top</text><g filter="url(#sh)"><image href="img/leader_ostra.png" x="107.1" y="190" width="226.8" height="316.8" /></g><rect x="100" y="600" width="241.0" height="412.0" rx="10" fill="#1B3440"/><g filter="url(#sh)"><image href="img/wall_slot.png" x="90" y="590" width="261.0" height="432.0" /></g><path d="M381.0,260 L381.0,630" fill="none" stroke="#E8603A" stroke-width="6" marker-end="url(#ah)"/><rect x="103.1" y="586" width="234.8" height="8" rx="4" fill="#0F3A48"/><text x="220.5" y="1054.0" class="b" font-size="15" text-anchor="middle">the slit along the Wall's top edge</text><text x="701.25" y="150" class="t" font-size="22" text-anchor="middle">2 · In place</text><g filter="url(#sh)"><image href="img/leader_ostra.png" x="543.75" y="240.0" width="315.0" height="440.0" /><image href="img/wall_slot.png" x="520" y="200" width="362.5" height="600.0" /></g><line x1="852.5" y1="385.0" x2="922.5" y2="385.0" stroke="#0F3A48" stroke-width="2"/><text x="930.5" y="379.0" class="b" font-size="15" text-anchor="start">portrait window</text><text x="930.5" y="398.5" class="b" font-size="15" text-anchor="start">(the card's arch)</text><line x1="852.5" y1="632.5" x2="922.5" y2="632.5" stroke="#0F3A48" stroke-width="2"/><text x="930.5" y="626.5" class="b" font-size="15" text-anchor="start">Legacy plaque</text><text x="930.5" y="646.0" class="b" font-size="15" text-anchor="start">(still in force)</text><line x1="725.25" y1="710.0" x2="922.5" y2="740.0" stroke="#0F3A48" stroke-width="2"/><text x="930.5" y="736.0" class="b" font-size="15" text-anchor="start">slot number:</text><text x="930.5" y="755.5" class="b" font-size="15" text-anchor="start">the game clock</text><text x="1360" y="150" class="t" font-size="22" text-anchor="middle">3 · Side view</text><rect x="1210" y="230" width="34" height="480" rx="6" fill="#E9DFC8" stroke="#B9A57A" stroke-width="3"/><rect x="1280" y="230" width="34" height="480" rx="6" fill="#E9DFC8" stroke="#B9A57A" stroke-width="3"/><rect x="1254" y="270" width="16" height="420" rx="4" fill="#FBEFD6" stroke="#0F3A48" stroke-width="3"/><rect x="1206" y="340" width="42" height="120" fill="#F7F1E4"/><rect x="1206" y="530" width="42" height="56" fill="#F7F1E4"/><path d="M1262,160 L1262,260" fill="none" stroke="#E8603A" stroke-width="5" marker-end="url(#ah)"/><text x="1192" y="296.0" class="b" font-size="15" text-anchor="end">top layer, 2 mm:</text><text x="1192" y="315.5" class="b" font-size="15" text-anchor="end">windows cut through</text><text x="1192" y="626.0" class="b" font-size="15" text-anchor="end">the card, slotted</text><text x="1192" y="645.5" class="b" font-size="15" text-anchor="end">between the layers</text><text x="1334" y="480.0" class="b" font-size="15" text-anchor="start">bottom layer,</text><text x="1334" y="499.5" class="b" font-size="15" text-anchor="start">2 mm: backing</text><line x1="1210" y1="290" x2="1198" y2="290" stroke="#0F3A48" stroke-width="2"/><polyline points="1262,620 1198,620" fill="none" stroke="#0F3A48" stroke-width="2"/><line x1="1314" y1="475" x2="1328" y2="475" stroke="#0F3A48" stroke-width="2"/><rect x="40" y="1060" width="1420" height="90" rx="16" fill="#FBEFD6" stroke="#D8CDB6"/><text x="70" y="1098.0" class="b" font-size="16" text-anchor="start">Its paired event (and any Breakthrough token, set on the frame) goes to the same slot. When every slot is full and the event deck</text><text x="70" y="1118.8" class="b" font-size="16" text-anchor="start">is empty, the next Dawn draw loses the game: the Wall is the game's clock.</text></svg>