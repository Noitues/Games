<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1780" height="1000" viewBox="0 0 1780 1000"><defs><style>@font-face{font-family:Righteous;src:url('../fonts/Righteous-Regular.ttf')}@font-face{font-family:Josefin;src:url('../fonts/JosefinSans[wght].ttf')}.t{font-family:Righteous,sans-serif;fill:#0F3A48}.b{font-family:Josefin,sans-serif;fill:#203038}</style><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#E8603A"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity=".3"/></filter></defs><rect width="1780" height="1000" fill="#F7F1E4"/><text x="40" y="54" class="t" font-size="34" text-anchor="start">Card anatomy</text><g filter="url(#sh)"><image href="img/leader_pell.png" x="290" y="130" width="390.6" height="545.6" /></g><g filter="url(#sh)"><image href="img/event_E2-1.png" x="1190" y="130" width="390.6" height="545.6" /></g><text x="485.3" y="112" class="t" font-size="20" text-anchor="middle">A people card (a leader once chosen)</text><text x="1385.3" y="112" class="t" font-size="20" text-anchor="middle">An event card</text><circle cx="321.0" cy="159.76" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="321.0,159.76 272,159.76 266,159.76" fill="none" stroke="#E8603A" stroke-width="2"/><text x="260" y="164.76" class="b" font-size="17" text-anchor="end" font-weight="700">Name</text><text x="260" y="185.76" class="b" font-size="15" text-anchor="end">the person on the card</text><circle cx="485.3" cy="303.6" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="485.3,303.6 272,303.6 266,303.6" fill="none" stroke="#E8603A" stroke-width="2"/><text x="260" y="308.6" class="b" font-size="17" text-anchor="end" font-weight="700">Portrait</text><text x="260" y="329.6" class="b" font-size="15" text-anchor="end">shows through the Wall's</text><text x="260" y="348.6" class="b" font-size="15" text-anchor="end">window once retired</text><circle cx="321.0" cy="466.04" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="321.0,466.04 272,466.04 266,436.04" fill="none" stroke="#E8603A" stroke-width="2"/><text x="260" y="441.04" class="b" font-size="17" text-anchor="end" font-weight="700">Guilds</text><text x="260" y="462.04" class="b" font-size="15" text-anchor="end">count toward thresholds</text><circle cx="321.0" cy="493.32" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="321.0,493.32 272,493.32 266,523.3199999999999" fill="none" stroke="#E8603A" stroke-width="2"/><text x="260" y="528.3199999999999" class="b" font-size="17" text-anchor="end" font-weight="700">Reign</text><text x="260" y="549.3199999999999" class="b" font-size="15" text-anchor="end">while this leader is in Day,</text><text x="260" y="568.3199999999999" class="b" font-size="15" text-anchor="end">in its event's sections</text><circle cx="314.8" cy="613.6" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="314.8,613.6 272,613.6 266,653.6" fill="none" stroke="#E8603A" stroke-width="2"/><text x="260" y="658.6" class="b" font-size="17" text-anchor="end" font-weight="700">Legacy</text><text x="260" y="679.6" class="b" font-size="15" text-anchor="end">from Dusk on, for the rest of</text><text x="260" y="698.6" class="b" font-size="15" text-anchor="end">the voyage: one benefit,</text><text x="260" y="717.6" class="b" font-size="15" text-anchor="end">one or more drawbacks</text><circle cx="655.8" cy="159.76" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="655.8,159.76 698.6,159.76 704.6,159.76" fill="none" stroke="#E8603A" stroke-width="2"/><text x="710.6" y="164.76" class="b" font-size="17" text-anchor="start" font-weight="700">Cost</text><text x="710.6" y="185.76" class="b" font-size="15" text-anchor="start">in credits</text><circle cx="513.2" cy="466.04" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="513.2,466.04 698.6,466.04 704.6,466.04" fill="none" stroke="#E8603A" stroke-width="2"/><text x="710.6" y="471.04" class="b" font-size="17" text-anchor="start" font-weight="700">Effect</text><text x="710.6" y="492.04" class="b" font-size="15" text-anchor="start">in icons: 2 credits; Lockout</text><circle cx="1385.3" cy="247.8" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="1385.3,247.8 1172,247.8 1166,247.8" fill="none" stroke="#E8603A" stroke-width="2"/><text x="1160" y="252.8" class="b" font-size="17" text-anchor="end" font-weight="700">Picture</text><text x="1160" y="273.8" class="b" font-size="15" text-anchor="end">where the trouble is</text><circle cx="1252.0" cy="402.8" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="1252.0,402.8 1172,402.8 1166,382.8" fill="none" stroke="#E8603A" stroke-width="2"/><text x="1160" y="387.8" class="b" font-size="17" text-anchor="end" font-weight="700">When revealed</text><text x="1160" y="408.8" class="b" font-size="15" text-anchor="end">a one-time effect, read at</text><text x="1160" y="427.8" class="b" font-size="15" text-anchor="end">Dawn (if the event has one)</text><circle cx="1208.6" cy="486.5" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="1208.6,486.5 1172,486.5 1166,506.5" fill="none" stroke="#E8603A" stroke-width="2"/><text x="1160" y="511.5" class="b" font-size="17" text-anchor="end" font-weight="700">Tuck line</text><text x="1160" y="532.5" class="b" font-size="15" text-anchor="end">the leader covers everything</text><text x="1160" y="551.5" class="b" font-size="15" text-anchor="end">above it on the conveyor</text><circle cx="1248.9" cy="542.3" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="1248.9,542.3 1172,542.3 1166,612.3" fill="none" stroke="#E8603A" stroke-width="2"/><text x="1160" y="617.3" class="b" font-size="17" text-anchor="end" font-weight="700">Stage</text><text x="1160" y="638.3" class="b" font-size="15" text-anchor="end">I, II or III</text><circle cx="1351.2" cy="542.3" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="1351.2,542.3 1598.6,542.3 1604.6,522.3" fill="none" stroke="#E8603A" stroke-width="2"/><text x="1610.6" y="527.3" class="b" font-size="17" text-anchor="start" font-weight="700">Section types</text><text x="1610.6" y="548.3" class="b" font-size="15" text-anchor="start">where it seeds, grows</text><text x="1610.6" y="567.3" class="b" font-size="15" text-anchor="start">and collapses</text><circle cx="1512.4" cy="638.4000000000001" r="6" fill="#E8603A" stroke="#fff" stroke-width="2"/><polyline points="1512.4,638.4000000000001 1598.6,638.4000000000001 1604.6,638.4000000000001" fill="none" stroke="#E8603A" stroke-width="2"/><text x="1610.6" y="643.4000000000001" class="b" font-size="17" text-anchor="start" font-weight="700">Twist</text><text x="1610.6" y="664.4000000000001" class="b" font-size="15" text-anchor="start">Stage II and III:</text><text x="1610.6" y="683.4000000000001" class="b" font-size="15" text-anchor="start">an extra rule</text><rect x="40" y="890" width="1700" height="80" rx="16" fill="#FBEFD6" stroke="#D8CDB6"/><text x="70" y="922.0" class="b" font-size="16" text-anchor="start">Icons: a number, then what it acts on, read left to right. 2 [wrench] = 2 damage to threat; 1 [shield] = Brace 1.</text><text x="70" y="942.8" class="b" font-size="16" text-anchor="start">Teal bands are benefits, red bands drawbacks. The icon sheet at the back of the rulebook lists every icon.</text></svg>