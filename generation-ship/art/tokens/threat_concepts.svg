sefin" font-size="15" font-weight="700" fill="#4A4F55" text-anchor="middle">Fault</text><g transform="translate(590 960) rotate(0) scale(1.0)"><path d="M-36,0 L-36,-20 L-20,-20 L-20,-120 L-30,-120 L-30,-136 C-30,-176 30,-176 30,-136 L30,-120 L20,-120 L20,-20 L36,-20 L36,0 Z" fill="#4E545B" stroke="#1A1D20" stroke-width="2.5" stroke-linejoin="round"/><path d="M-30,-146 L-60,-162 M30,-146 L60,-162 M0,-176 L0,-196" stroke="#4E545B" stroke-width="7" stroke-linecap="round"/></g><text x="590" y="988" font-family="Josefin" font-size="15" font-weight="700" fill="#4A4F55" text-anchor="middle">Failure</text><line x1="800" y1="960" x2="1120" y2="960" stroke="#B9AE98" stroke-width="2"/><g transform="translate(880 930) rotate(-90) scale(0.8)"><path d="M-36,0 L-36,-20 L-20,-20 L-20,-120 L-30,-120 L-30,-136 C-30,-176 30,-176 30,-136 L30,-120 L20,-120 L20,-20 L36,-20 L36,0 Z" fill="#4E545B" stroke="#1A1D20" stroke-width="2.5" stroke-linejoin="round"/><path d="M-30,-146 L-60,-162 M30,-146 L60,-162 M0,-176 L0,-196" stroke="#4E545B" stroke-width="7" stroke-linecap="round"/></g><g transform="translate(1050 810) rotate(180) scale(0.8)"><path d="M-36,0 L-36,-20 L-20,-20 L-20,-120 L-30,-120 L-30,-136 C-30,-176 30,-176 30,-136 L30,-120 L20,-120 L20,-20 L36,-20 L36,0 Z" fill="#4E545B" stroke="#1A1D20" stroke-width="2.5" stroke-linejoin="round"/><path d="M-30,-146 L-60,-162 M30,-146 L60,-162 M0,-176 L0,-196" stroke="#4E545B" stroke-width="7" stroke-linecap="round"/></g><text x="880" y="988" font-family="Josefin" font-size="15" fill="#8A3A16" text-anchor="middle">1 damage</text><text x="1050" y="988" font-family="Josefin" font-size="15" fill="#8A3A16" text-anchor="middle">2 damage</text><text x="1160" y="790" font-family="Josefin" font-size="17" fill="#2E6B3A">+ instantly reads as 'danger, rising'</text><text x="1160" y="820" font-family="Josefin" font-size="17" fill="#2E6B3A">+ great silhouettes, very retro</text><text x="1160" y="850" font-family="Josefin" font-size="17" fill="#8A3A16">− an alarm is the symptom, not the problem: 'repairing an alarm' is odd</text><text x="1160" y="880" font-family="Josefin" font-size="17" fill="#8A3A16">− could be cast in translucent amber (a colour)</text><text x="1160" y="920" font-family="Righteous" font-size="20" fill="#0F3A48">★★★☆☆</text><rect x="40" y="1040" width="1720" height="280" rx="18" fill="#F7F1E4" stroke="#D8CDB6"/><text x="70" y="1080" font-family="Righteous" font-size="26" fill="#0F3A48">Rogue drones</text><text x="70" y="1108" font-family="Josefin" font-size="17" fill="#4A4F55">maintenance drone → crawler → servitor</text><line x1="70" y1="1260" x2="760" y2="1260" stroke="#B9AE98" stroke-width="2"/><g transform="translate(150 1260) rotate(0) scale(1.0)"><path d="M-40,-14 C-40,-34 40,-34 40,-14 L48,-14 L48,-6 L-48,-6 L-48,-14 Z" fill="#4E545B" stroke="#1A1D20" stroke-width="2.5" stroke-linejoin="round"/><path d="M-24,-6 L-30,0 M24,-6 L30,0" stroke="#4E545B" stroke-width="7" stroke-linecap="round"/></g><text x="150" y="1288" font-family="Josefin" font-size="15" font-weight="700" fill="#4A4F55" text-anchor="middle">Glitch</text><g transform="translate(370 1260) rotate(0) scale(1.0)"><path d="M-30,-30 C-30,-64 30,-64 30,-30 Z" fill="#4E545B" stroke="#1A1D20" stroke-width="2.5" stroke-linejoin="round"/><path d="M-28,-30 L-56,0 M-14,-30 L-30,0 M14,-30 L30,0 M28,-30 L56,0" stroke="#4E545B" stroke-width="9" stroke-linecap="round"/></g><text x="370" y="1288" font-family="Josefin" font-size="15" font-weight="700" fill="#4A4F55" text-anchor="middle">Fault</text><g transform="translate(590 1260) rotate(0) scale(1.0)"><path d="M-30,0 L-30,-60 L-40,-60 L-40,-120 L-20,-120 L-20,-160 L20,-160 L20,-120 L40,-120 L40,-60 L30,-60 L30,0 L8,0 L8,-50 L-8,-50 L-8,0 Z" fill="#4E545B" stroke="#1A1D20" stroke-width="2.5" stroke-linejoin="round"/><path d="M0,-160 L0,-184" stroke="#4E545B" stroke-width="5"/><circle cx="0" cy="-188" r="6" fill="#4E545B" stroke="#1A1D20" stroke-width="2"/></g><text x="590" y="1288" font-family="Jo