<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1680" viewBox="0 0 1800 1680"><defs><style>@font-face { font-family: Righteous; src: url('file:///home/user/Games/generation-ship/art/fonts/Righteous-Regular.ttf'); }@font-face { font-family: Josefin; src: url('file:///home/user/Games/generation-ship/art/fonts/JosefinSans%5Bwght%5D.ttf'); }</style></defs><rect width="1800" height="1680" fill="#EDE6D8"/><text x="60" y="62" font-family="Righteous" font-size="32" fill="#0F3A48">The threat ladder: five families</text><text x="60" y="94" font-family="Josefin" font-size="18" fill="#4A4F55">Glitch → Fault → Failure, gunmetal plastic, to scale (8 px = 1 mm). Right: the Failure's damage postures (on its side, upside down). Score: designer fit, out of 5.</text><rect x="40" y="140" width="1720" height="280" rx="18" fill="#F7F1E4" stroke="#D8CDB6"/><text x="70" y="180" font-family="Righteous" font-size="26" fill="#0F3A48">Machine parts (current)</text><text x="70" y="208" font-family="Josefin" font-size="17" fill="#4A4F55">loose nut → broken cog → cracked vacuum tube</text><line x1="70" y1="360" x2="760" y2="360" stroke="#B9AE98" stroke-width="2"/><g transform="translate(150 360) rotate(0) scale(1.0)"><path d="M-40,0 L-46,-12 L-40,-34 L40,-34 L46,-12 L40,0 Z" fill="#4E545B" stroke="#1A1D20" stroke-width="2.5" stroke-linejoin="round"/></g><text x="150" y="388" font-family="Josefin" font-size="15" font-weight="700" fill="#4A4F55" text-anchor="middle">Glitch</text><g transform="translate(370 360) rotate(0) scale(1.0)"><path d="M-56,0 L-50,-30 L-56,-56 L-30,-56 L-20,-90 L20,-90 L30,-56 L56,-56 L50,-30 L56,0 Z" fill="#4E545B" stroke="#1A1D20" stroke-width="2.5" stroke-linejoin="round"/></g><text x="370" y="388" font-family="Josefin" font-size="15" font-weight="700" fill="#4A4F55" text-anchor="middle">Fault</text><g transform="translate(590 360) rotate(0) scale(1.0)"><path d="M-44,0 L-44,-30 L-18,-30 L-18,-48 C-38,-56 -38,-80 -38,-150 C-38,-178 38,-178 38,-150 C38,-80 38,-5