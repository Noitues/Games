<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generation Ship</title>
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
<header id="topbar">
  <strong>Generation Ship</strong>
  <span id="status"></span>
  <span class="spacer"></span>
  <button id="btn-step" title="Run the next phase">Step</button>
  <button id="btn-auto" title="Keep running until a human decision">Auto</button>
  <button id="btn-undo" title="Go back to the start of the previous phase">Undo phase</button>
  <button id="btn-new">New game</button>
  <button id="btn-mute" title="Toggle sound">🔊</button>
</header>

<section id="setup" class="panel">
  <h2>New game</h2>
  <div id="seats"></div>
  <div class="row">
    <label>Players <select id="players"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
    <label>Event pairing <select id="pairing"><option value="offset">Offset (event after the vote)</option><option value="direct">Direct (event before the vote)</option></select></label>
    <label>Win conditions <select id="tiers"><option value="shifted">Shifted (default)</option><option value="classic">Classic</option></select></label>
    <label>Destination <select id="destination"></select></label>
    <label>Level <select id="level"></select></label>
    <label><input type="checkbox" id="landfall"> Landfall card</label>
    <label>Seed <input id="seed" type="number" value="1" style="width:6em"></label>
  </div>
  <button id="btn-start" class="primary">Start</button>
</section>

<main id="game" hidden>
  <aside id="left">
    <h3>Generations</h3>
    <div id="conveyor"></div>
    <h3>Discoveries</h3>
    <div id="discoveries"></div>
  </aside>
  <section id="center">
    <div id="prompt"></div>
    <div id="mapwrap"><svg id="map"></svg></div>
    <div id="legend">▲ Glitch · ■ Fault · ⬢ Failure · ☺ Crew · ✸ Decay · ● influence (house color) · Br Brace · Q Quarantine · P Patch · L Lockout · U Unrest · I Isolate · thick top edge = Outer Hull</div>
    <h3>Wall of Leaders</h3>
    <div id="wall"></div>
  </section>
  <aside id="right">
    <div id="houses"></div>
    <h3>Log</h3>
    <ol id="log"></ol>
  </aside>
</main>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
